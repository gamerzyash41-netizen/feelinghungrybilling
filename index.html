function settings(){return pageTitle('Settings','Business, tax, discount, kitchen and printing preferences')+`<div class="grid two"><div class="card"><h2>Business</h2><div class="formgrid"><label>Business Name<input class="input" value="Feeling Hungry"></label><label>GSTIN<input class="input" placeholder="Optional"></label><label class="full">Address<textarea>Nahan, Himachal Pradesh, India</textarea></label><label>Phone<input class="input" placeholder="Business phone"></label><label>Email<input class="input" placeholder="Business email"></label></div></div><div class="card"><h2>POS & Printing</h2><div class="formgrid"><label>Tax %<input id="taxSet" class="input" type="number" min="0" max="100" step="0.01" value="${state.settings.tax}"></label><label>Default Discount %<input id="discountSet" class="input" type="number" min="0" max="100" step="0.01" value="${state.settings.discount||0}"></label><label>KOT Paper Width<select id="kotWidthSet" class="select"><option value="79" ${Number(state.settings.kotWidth||79)===79?'selected':''}>79 mm</option><option value="58" ${Number(state.settings.kotWidth||79)===58?'selected':''}>58 mm</option></select></label><label>Receipt Width<select id="receiptSet" class="select"><option value="79" ${Number(state.settings.receipt||79)===79?'selected':''}>79 mm</option><option value="58" ${Number(state.settings.receipt||79)===58?'selected':''}>58 mm</option></select></label><label>Default Order Type<select class="select"><option>DINE-IN</option><option>TAKEAWAY</option></select></label><label>Auto Print KOT for Online Orders<select id="autoPrintOnlineSet" class="select"><option value="on" ${state.autoPrintOnlineKots?'selected':''}>On — print kitchen ticket automatically when a QR/online order comes in</option><option value="off" ${!state.autoPrintOnlineKots?'selected':''}>Off</option></select></label></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save Settings</button></div></div><div class="card"><h2>Firebase Connection</h2><p class="muted">Project: <b>${firebaseConfig.projectId}</b></p>${firebaseStatus==='connected'?'<span class="badge good">Connected — Firestore live sync active</span>':firebaseStatus==='error'?`<span class="badge bad">Connection error</span><p class="muted">${firebaseError}</p><p class="muted">Check that your Firestore Security Rules allow read/write access.</p>`:'<span class="badge warn">Connecting…</span>'}</div><div class="card"><h2>Customer & Receipt Data</h2><p class="muted">Customer name and mobile can be saved during billing. Entering the same mobile on a future bill automatically finds the saved customer. Receipts print on a white background with larger text.</p></div><div class="card"><h2>Data Integrity</h2><p class="muted">Orders, KOTs, menu, inventory, suppliers and expenses are stored in Firestore collections and sync in real time across devices. Historical order/menu prices are captured at time of sale.</p></div></div>`}
async function saveSettings(){
 if(!firebaseReady()) return;
 const tax=Math.max(0,+document.getElementById('taxSet').value||0);
 const discount=Math.min(100,Math.max(0,+document.getElementById('discountSet').value||0));
 const receipt=+(document.getElementById('receiptSet').value||79);
 const kotWidth=+(document.getElementById('kotWidthSet').value||79);
 const autoPrintOnline=(document.getElementById('autoPrintOnlineSet')?.value||'on')==='on';
 state.autoPrintOnlineKots=autoPrintOnline;
 await fs.setDoc(fs.doc(db,'settings','main'), {...state.settings,tax,discount,receipt,kotWidth,autoPrintOnlineKots:autoPrintOnline});
 toast('Settings saved'); render();
}

function initProfitLossChart(){
 try{
  const canvas=document.getElementById('profitLossChart');
  if(!canvas) return;
  if(window.hideoutPnLChart){try{window.hideoutPnLChart.destroy()}catch(e){} window.hideoutPnLChart=null;}
  if(!window.Chart){const wrap=canvas.parentElement;if(wrap)wrap.innerHTML='<div class="pnl-fallback">Profit &amp; Loss chart is unavailable until the chart library loads.</div>';return;}
  const days=[];const today=new Date();
  for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(today.getDate()-i);days.push({key:dateKeyLocal(d),label:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})});}
  const totals=Object.fromEntries(days.map(d=>[d.key,{revenue:0,cogs:0,expenses:0,profit:0}]));
  (state.orders||[]).forEach(o=>{
    const key=orderLocalDate(o);if(!totals[key])return;
    totals[key].revenue+=Number(o.total||0);
    (o.items||[]).forEach(i=>{
      const menuItem=(state.menu||[]).find(m=>m.id===i.id||String(m.name||'').trim().toLowerCase()===String(i.name||'').trim().toLowerCase());
      let unitCost=Number(i.cost||0);
      if(unitCost<=0) unitCost=Number(menuItem?.cost||0);
      // If no explicit menu-item cost exists, estimate COGS from its saved recipe
      // and current ingredient costs in Inventory, when recipe data is available.
      if(unitCost<=0 && Array.isArray(i.recipe) && i.recipe.length){
        unitCost=i.recipe.reduce((sum,r)=>{
          const ingredient=(state.inventory||[]).find(x=>x.id===r.inventoryId||x.name===r.name);
          return sum+Number(r.qty||0)*Number(ingredient?.cost||0);
        },0);
      }
      totals[key].cogs+=Math.max(0,unitCost)*Math.max(0,Number(i.qty||0));
    });
  });
  (state.expenses||[]).forEach(e=>{
    const key=expenseDateKey(e);if(!totals[key])return;
    totals[key].expenses+=Number(e.amount||0);
  });
  days.forEach(d=>{const t=totals[d.key];t.profit=t.revenue-t.cogs-t.expenses;});
  const labels=days.map(d=>d.label);
  const values=k=>days.map(d=>Math.round((totals[d.key][k]||0)*100)/100);
  const ctx=canvas.getContext('2d');
  const gradient=(top,bottom)=>{const g=ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,top);g.addColorStop(1,bottom);return g;};
  window.hideoutPnLChart=new Chart(ctx,{type:'line',data:{labels,datasets:[
   {label:'Revenue',data:values('revenue'),borderColor:'#22a06b',backgroundColor:gradient('rgba(34,157,103,.13)','rgba(34,157,103,.01)'),fill:false,tension:.3,borderWidth:2.2,pointRadius:3,pointHoverRadius:5},
   {label:'COGS',data:values('cogs'),borderColor:'#3978c9',backgroundColor:gradient('rgba(57,120,201,.10)','rgba(57,120,201,.01)'),fill:false,tension:.3,borderWidth:2,pointRadius:3,pointHoverRadius:5},
   {label:'Expenses',data:values('expenses'),borderColor:'#f59e0b',backgroundColor:gradient('rgba(245,158,11,.10)','rgba(245,158,11,.01)'),fill:false,tension:.3,borderWidth:2,pointRadius:3,pointHoverRadius:5},
   {label:'Net Profit',data:values('profit'),borderColor:'#7c5ac7',backgroundColor:gradient('rgba(124,90,199,.15)','rgba(124,90,199,.01)'),fill:true,tension:.3,borderWidth:3,pointRadius:3,pointHoverRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#18202b',padding:10,callbacks:{label:c=>`${c.dataset.label}: ₹${Number(c.parsed.y||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`}}},scales:{x:{grid:{display:false},ticks:{color:'#7a8796',font:{size:10,weight:'600'}}},y:{grid:{color:'rgba(148,163,184,.16)'},ticks:{color:'#7a8796',font:{size:10},callback:v=>`₹${Number(v).toLocaleString('en-IN')}`},border:{display:false}}}}});
 }catch(err){console.error('Profit & Loss chart error:',err);}
}

function exportCSV(){let rows=[['Item','Category','Selling Price','Cost','Sold Today'],...state.menu.map(m=>[m.name,m.cat,m.price,m.cost,m.sold||0])];let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Feeling Hungry-export.csv';a.click();toast('CSV exported')}
function openModal(s){document.getElementById('modalbox').innerHTML=s;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function render(){
 try{
  navRender();
  const pages={
   dashboard:dashboard,pos:pos,tables:tables,orders:orders,kot:kot,kitchen:kitchen,menu:menu,combos:combos,
   inventory:inventory,purchases:purchases,suppliers:suppliers,expenses:expenses,customers:customers,sales:sales,invreports:invreports,pnl:pnl,staff:staff,settings:settings
  };
  if(!pages[state.page]) state.page='dashboard';
  document.getElementById('pages').innerHTML=statusBanner()+`<section class="page active">${pages[state.page]()}</section>`;
  if(state.page==='dashboard') setTimeout(initProfitLossChart,0);
 }catch(err){
  console.error('Render error:',err);
  const pagesEl=document.getElementById('pages');
  if(pagesEl) pagesEl.innerHTML=`<div class="card"><b>POS display error</b><p class="muted">${esc(err?.message||err)}</p><button class="btn primary" onclick="location.reload()">Reload POS</button></div>`;
 }
}
render();
