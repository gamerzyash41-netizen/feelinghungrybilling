/* ===== Modern dashboard refresh ===== */
:root{
  --bg:#eef1f5;
  --panel:#ffffff;
  --panel2:#e7ebf0;
  --soft:#f5f7fa;
  --line:#d9dee6;
  --text:#17202d;
  --muted:#697586;
  --accent:#f59e0b;
  --good:#1f9d67;
  --warn:#d97706;
  --bad:#dc4c4c;
  --blue:#3978c9;
  --r:14px;
  --shadow:0 8px 24px rgba(15,23,42,.07);
  --shadow-soft:0 3px 12px rgba(15,23,42,.05);
}
body{background:var(--bg);color:var(--text)}
.sidebar{background:#fff;box-shadow:4px 0 22px rgba(15,23,42,.06);border-right:1px solid #dfe3e8}
.nav button{transition:background .18s ease,color .18s ease,transform .18s ease}
.nav button:hover{background:#fff7eb;color:#b85e00;transform:translateX(1px)}
.nav button.active{background:#fff1dc;color:#b85e00;font-weight:800;box-shadow:inset 3px 0 0 var(--accent)}
.nav button.active .ico{color:#d97706}
.card{box-shadow:var(--shadow);border-color:#dfe4ea}
.top h1{font-weight:800;letter-spacing:-.02em}
.top p{color:#788496}
.btn{box-shadow:0 2px 6px rgba(15,23,42,.04)}
.btn.primary{background:var(--accent);color:#1d1608;box-shadow:0 5px 14px rgba(245,158,11,.22)}

/* Metric cards */
.stats{gap:15px}
.stats .stat{position:relative;overflow:hidden;min-height:136px;padding:17px 18px;border-radius:16px}
.stats .stat:after{content:"";position:absolute;right:-20px;bottom:-28px;width:118px;height:118px;border-radius:50%;background:currentColor;opacity:.055;pointer-events:none}
.stats .stat .metric-icon{position:absolute;right:18px;top:14px;font-size:42px;opacity:.12;line-height:1;pointer-events:none}
.stats .stat .label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#667085}
.stats .stat .value{font-size:27px;line-height:1.1;font-weight:850;letter-spacing:-.02em;color:#151b24;margin:10px 0 7px}
.stats .stat .muted{font-size:12px}
.stats .stat.metric-sales{color:#c77800;border-top:3px solid #f59e0b}
.stats .stat.metric-orders{color:#3978c9;border-top:3px solid #3978c9}
.stats .stat.metric-items{color:#7c5ac7;border-top:3px solid #7c5ac7}
.stats .stat.metric-profit{color:#1f9d67;border-top:3px solid #1f9d67}
.stats .stat.metric-profit .value{color:#12633f}
.stats .stat.metric-orders .value{color:#173f73}
.stats .stat.metric-sales .value{color:#151b24}
.stats .stat.metric-items .value{color:#3f316b}

/* Dashboard status badges */
.ops-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ops-status{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fafbfc}
.ops-status .ops-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:850;flex:0 0 38px}
.ops-status .ops-copy{min-width:0}
.ops-status .ops-copy span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.ops-status .ops-copy b{font-size:21px;line-height:1;color:#17202d}
.ops-status.available .ops-dot{background:#dcf7e9;color:#147347}
.ops-status.preparing .ops-dot{background:#fff0ca;color:#9a6700}
.ops-status.ready .ops-dot{background:#dcecff;color:#245f9f}
.ops-status.occupied .ops-dot{background:#f1e8ff;color:#7351a8}

/* Payment donut */
.payment-layout{display:grid;grid-template-columns:minmax(180px,220px) 1fr;gap:18px;align-items:center}
.payment-donut-wrap{display:grid;place-items:center;min-height:190px}
.payment-donut{width:170px;height:170px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06)}
.payment-donut:after{content:"";position:absolute;inset:38px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(15,23,42,.05)}
.payment-donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;padding-top:2px}
.payment-donut-center b{font-size:17px;color:#141a22}
.payment-donut-center span{display:block;font-size:10px;color:var(--muted);margin-top:-32px}
.payment-legend{display:grid;gap:11px}
.payment-item{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center}
.payment-item .swatch{width:10px;height:10px;border-radius:50%}
.payment-item .p-label{font-size:12px;color:#596578}
.payment-item .p-value{font-size:13px;font-weight:800;color:#18202b}
.payment-item .p-percent{display:block;font-size:10px;color:#8a94a3;margin-top:1px}

/* Accounting tables */
.dashboard-table{border-radius:11px;overflow:hidden;border:1px solid #e4e7ec}
.dashboard-table .data thead th{background:#f7f8fa;border-bottom:1px solid #e0e4ea;color:#667085;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.dashboard-table .data tbody tr:nth-child(even){background:#fafbfc}
.dashboard-table .data tbody tr:hover{background:#fff6e8}
.dashboard-table .data td{font-size:12px;color:#283240}
.dashboard-table .data td.amount-cell{font-weight:800;color:#151b24;text-align:right}
.dashboard-table .data td.qty-cell{text-align:center;font-weight:700;color:#475467}
.top-items-table .item-name{font-weight:750;color:#1a2430}
.top-items-table .category-note{font-size:10px;color:#8a94a3;margin-top:2px}

@media(max-width:900px){
  .payment-layout{grid-template-columns:1fr}
  .payment-donut-wrap{min-height:165px}
}
@media(max-width:700px){
  .ops-grid{grid-template-columns:1fr}
  .stats .stat{min-height:124px}
}


/* ===== Premium dashboard polish + P&L chart ===== */
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.005em}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(15,23,42,.085);border-color:#d4dbe5}
.section-title h2{font-weight:800;letter-spacing:-.015em}
.dashboard-table .data tbody tr{transition:background .16s ease}
.payment-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;line-height:1;white-space:nowrap;border:1px solid transparent}
.payment-pill i{font-size:9px}
.payment-pill.cash{background:#e6f7ee;color:#11704a;border-color:#c8ecd9}
.payment-pill.upi{background:#e8f0ff;color:#245e9f;border-color:#cdddf8}
.payment-pill.card{background:#fff0dc;color:#a85b06;border-color:#f5d7ad}
.payment-pill.other{background:#eef1f5;color:#586475;border-color:#dbe0e7}
.pnl-card{padding:16px 18px 18px}
.pnl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.pnl-head h2{margin:0;font-size:16px}
.pnl-subtitle{margin:4px 0 0;color:#7b8798;font-size:11px}
.pnl-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pnl-legend span{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#687385;font-weight:700}
.pnl-legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
.pnl-chart-wrap{position:relative;height:265px;min-height:220px}
.pnl-chart-wrap canvas{display:block;width:100%!important;height:100%!important}
.pnl-fallback{height:100%;display:grid;place-items:center;border:1px dashed #d9dee6;border-radius:12px;background:#fafbfc;color:#7a8796;font-size:12px;text-align:center;padding:20px}
@media(max-width:700px){.pnl-head{flex-direction:column}.pnl-chart-wrap{height:235px}}


/* Organized pizza size picker: Small → Medium → Large */
.pizza-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.pizza-menu-card{display:flex;flex-direction:column;gap:13px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-soft)}
.pizza-card-top{display:flex;align-items:flex-start;gap:11px;min-width:0}
.pizza-card-emoji{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:12px;background:#fff2db;font-size:26px}
.pizza-card-copy{min-width:0;flex:1}
.pizza-card-name{font-size:14px;font-weight:850;line-height:1.35;color:var(--text);overflow-wrap:anywhere}
.pizza-card-subtitle{font-size:11px;line-height:1.45;color:var(--muted);margin-top:4px}
.pizza-size-heading{font-size:10px;font-weight:850;letter-spacing:.09em;color:var(--muted)}
.pizza-size-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pizza-size-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;min-height:62px;padding:8px 3px;border:1px solid #f2d4a2;border-radius:10px;background:#fff8ec;color:#68400b;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.pizza-size-btn:hover{transform:translateY(-1px);border-color:var(--accent);background:#fff0cf}
.pizza-size-label{font-size:11px;font-weight:850;line-height:1.2}
.pizza-size-price{font-size:12px;font-weight:850;line-height:1.2;white-space:nowrap}
.pizza-size-btn:disabled{cursor:not-allowed;transform:none;border-color:var(--line);background:var(--soft);color:#98a1ae}
.pizza-size-btn:disabled .pizza-size-price{font-size:10px;font-weight:650;white-space:normal}
.pizza-single-note{font-size:11px;color:var(--muted);margin-top:auto}
.pizza-single-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:1100px){.pizza-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.pizza-menu-grid{grid-template-columns:1fr}.pizza-menu-card{padding:12px}.pizza-size-options{gap:8px}}

/* Premium Midnight Glass Theme Override */
body {
  background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed !important;
  background-size: cover !important;
  color: #fff !important;
}

/* Force transparent containers */
.app, .main, table, tbody, tr, td, th, .dashboard-table .data tbody tr:nth-child(even), .dashboard-table .data tbody tr:hover {
  background: transparent !important;
}

/* Dark Frosted Panels with realistic edge lighting */
.sidebar, .card, .menu-category-block, .product, .table-card, .kcol, .modalbox, .auth-box, .pizza-menu-card, .build-burger-card {
  background: rgba(15, 23, 42, 0.55) !important;
  backdrop-filter: blur(30px) !important;
  -webkit-backdrop-filter: blur(30px) !important;
  border: 1px solid transparent !important;
  border-image: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 60%) 1 !important;
  border-radius: 20px !important;
  box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5) !important;
  color: #fff !important;
}

/* Glassy Inputs and neutral buttons */
.input, .select, textarea, .nav button, .pos-category-title, .menu-category-head {
  background: rgba(15, 23, 42, 0.4) !important;
  backdrop-filter: blur(10px) !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  color: #fff !important;
}

/* Luminous accents: primary actions, active states, prices */
.btn.primary, .cat.active, .nav button.active, .price, .accent {
  background: #ffb020 !important;
  color: #17130b !important;
  border: 1px solid #ffb020 !important;
  box-shadow: 0 0 18px 2px rgba(255, 176, 32, 0.55) !important;
  text-shadow: none !important;
}

.btn {
  background: rgba(15, 23, 42, 0.4) !important;
  border: 1px solid rgba(34, 211, 238, 0.4) !important;
  color: #22d3ee !important;
}
.btn:hover, .nav button:hover {
  background: rgba(34, 211, 238, 0.12) !important;
  box-shadow: 0 0 14px 1px rgba(34, 211, 238, 0.35) !important;
}

/* Crisp typography: pure white primary, soft silver secondary, no muddy shadows */
h1, h2, h3, .value, .big, b, strong {
  color: #ffffff !important;
  text-shadow: none !important;
}
.label, .muted, small, p {
  color: #b9c2d0 !important;
  text-shadow: none !important;
}

.app, .main, #pages, .page { background: transparent !important; }

/* Main panels: enough opacity for legibility, with the image still visible. */
.sidebar, .card, .cart, .table-card, .kcol, .ticket,
.menu-category-block, .menu-item-row, .product, .pizza-menu-card,
.build-burger-card, .build-step, .recipe-box, .modalbox, .auth-box,
.ops-status, .dashboard-table, .table-wrap, .pnl-fallback, .toast {
  background: var(--fh-glass) !important;
  -webkit-backdrop-filter: blur(18px) saturate(135%) !important;
  backdrop-filter: blur(18px) saturate(135%) !important;
  border: 1px solid var(--fh-edge) !important;
  border-image: none !important;
  border-radius: 17px !important;
  box-shadow:
    0 14px 36px rgba(0, 0, 0, .34),
    inset 0 1px 0 rgba(255, 255, 255, .075) !important;
  color: var(--fh-copy) !important;
}
.sidebar {
  background: rgba(7, 13, 25, .91) !important;
  border-radius: 0 18px 18px 0 !important;
  border-left: 0 !important;
}
.cart { background: rgba(7, 13, 25, .88) !important; }
.modal { background: rgba(1, 5, 13, .72) !important; }
.auth-screen {
  background: rgba(3, 8, 19, .82) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  backdrop-filter: blur(12px) !important;
}

/* Table surfaces and separators. */
.table-wrap, .dashboard-table { overflow: auto; }
.data, .data tbody, .data tr, .data td { background: transparent !important; }
.data th, .dashboard-table .data thead th {
  background: rgba(4, 9, 18, .70) !important;
  color: #d4deec !important;
  border-bottom: 1px solid rgba(255,255,255,.15) !important;
}
.data td {
  color: #f1f5fb !important;
  border-bottom: 1px solid rgba(255,255,255,.10) !important;
}
.dashboard-table .data tbody tr:nth-child(even) { background: rgba(255,255,255,.035) !important; }
.dashboard-table .data tbody tr:hover { background: rgba(255,189,74,.10) !important; }
.menu-category-head, .pos-category-title {
  background: rgba(5, 11, 22, .58) !important;
  border-color: var(--fh-edge) !important;
}

/* High-contrast typography. */
body, .main, .card, .cart, .product, .table-card, .ticket,
.modalbox, .auth-box, .menu-item-row, .menu-category-block { color: var(--fh-copy) !important; }
h1, h2, h3, .top h1, .value, .big, b, strong,
.mi-name, .pizza-card-name, .payment-donut-center b { color: #ffffff !important; text-shadow: none !important; }
p, small, .muted, .label, .top p, .data th, .pnl-subtitle,
.payment-item .p-label, .payment-item .p-percent { color: var(--fh-muted) !important; }
.price {
  background: transparent !important;
  color: var(--fh-gold) !important;
  border: 0 !important;
  box-shadow: none !important;
  text-shadow: none !important;
}

/* Inputs, selectors and notes. */
.input, .select, textarea,
.build-option, .cat-arrow, .recipe-empty {
  background: rgba(5, 11, 22, .82) !important;
  color: #f7f9fd !important;
  border: 1px solid rgba(225, 235, 250, .22) !important;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.24) !important;
}
.input::placeholder, textarea::placeholder { color: #aab7ca !important; opacity: 1; }
.input:focus, .select:focus, textarea:focus {
  border-color: rgba(255, 189, 74, .88) !important;
  box-shadow: 0 0 0 3px rgba(255, 189, 74, .16) !important;
  outline: none !important;
}
.nav button {
  background: rgba(255,255,255,.045) !important;
  color: #edf3fb !important;
  border: 1px solid transparent !important;
}
.nav button:hover { background: rgba(255,255,255,.10) !important; color: #fff !important; }
.nav button.active, .cat.active {
  background: #ffbd4a !important;
  color: #17130b !important;
  border: 1px solid rgba(255,189,74,.95) !important;
  box-shadow: 0 5px 18px rgba(255,189,74,.20) !important;
}
.cat { background: rgba(7, 14, 27, .78) !important; color: #eef3fa !important; }
.btn {
  background: rgba(12, 21, 37, .82) !important;
  color: #eff5ff !important;
  border: 1px solid rgba(220, 232, 250, .22) !important;
  box-shadow: 0 5px 14px rgba(0,0,0,.18) !important;
}
.btn:hover { background: rgba(35, 52, 76, .92) !important; border-color: rgba(255,255,255,.34) !important; }
.btn.primary { background: #ffbd4a !important; color: #211705 !important; border-color: #ffbd4a !important; }
.btn.good { background: rgba(13, 91, 58, .92) !important; color: #d9ffeb !important; border-color: rgba(88,220,155,.55) !important; }
.btn.danger { background: rgba(112, 29, 39, .90) !important; color: #ffe3e6 !important; border-color: rgba(255,125,140,.48) !important; }
.btn.blue { background: rgba(25, 67, 112, .92) !important; color: #e2f0ff !important; border-color: rgba(112,177,255,.46) !important; }

/* Operational modules and readable data accents. */
.ops-status .ops-copy b { color: #fff !important; }
.payment-donut:after { background: rgba(7, 13, 25, .96) !important; }
.payment-donut-center span { color: #c2ccdc !important; }
.progress { background: rgba(255,255,255,.13) !important; }
.ticket li { color: #e4ebf5 !important; }
.reorder-banner { background: rgba(94, 61, 13, .68) !important; color: #fff4d6 !important; border-color: rgba(255,189,74,.55) !important; }
.customer-found { background: rgba(13, 91, 58, .72) !important; color: #e1ffed !important; border-color: rgba(88,220,155,.48) !important; }
.customer-new { background: rgba(30, 45, 65, .78) !important; color: #e9eff8 !important; border-color: rgba(220,232,250,.22) !important; }
.toast { background: rgba(7, 13, 25, .96) !important; color: #f8fafc !important; }

/* Respect devices that request reduced transparency. */
@media (prefers-reduced-transparency: reduce) {
  .sidebar, .card, .cart, .table-card, .kcol, .ticket,
  .menu-category-block, .menu-item-row, .product, .pizza-menu-card,
  .build-burger-card, .build-step, .recipe-box, .modalbox, .auth-box,
  .ops-status, .dashboard-table, .table-wrap, .toast {
    background: #101a2b !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}

// The POS receives a Firebase anonymous UID automatically. Firestore rules

let firebaseInitPromise = null;

let firestoreUnsubscribers = [];

function stopFirestoreListeners() {
  firestoreUnsubscribers.forEach(unsubscribe => {
    try { unsubscribe(); } catch (error) { console.warn('Listener cleanup failed', error); }
  });
  firestoreUnsubscribers = [];
}

function subscribeSnapshot(...args) {
  const unsubscribe = fs.onSnapshot(...args);
  firestoreUnsubscribers.push(unsubscribe);
  return unsubscribe;
}

async function waitForInitialAuthState() {
  return new Promise((resolve, reject) => {
    let unsubscribe = null;
    unsubscribe = fa.onAuthStateChanged(auth, user => {
      if (unsubscribe) unsubscribe();
      resolve(user || null);
    }, error => {
      if (unsubscribe) unsubscribe();
      reject(error);
    });
  });
}

async function ensureFirebaseInit() {
  if (!firebaseInitPromise) firebaseInitPromise = initFirebase();
  return firebaseInitPromise;
}

    const existingApp = appMod.getApps().find(item => item.name === '[DEFAULT]');
    const app = existingApp || appMod.initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    auth = fa.getAuth(app);

    // Wait for persisted anonymous auth to restore; create it only when absent.
    let user = await waitForInitialAuthState();
    if (!user) {
      const credential = await fa.signInAnonymously(auth);
      user = credential.user;
    }

    state.authUser = user;
    firebaseDeviceUid = user.uid;
    await startAuthenticatedFirestore();
  } catch (error) {
    console.error('Firebase initialization error:', error);
    firebaseStatus = 'error';
    firebaseError = error?.message || String(error);
    render();
  }
}

async function startAuthenticatedFirestore() {
  if (firestoreStartupPromise) return firestoreStartupPromise;

  firestoreStartupPromise = (async () => {
    firebaseStatus = 'connecting';
    firebaseError = '';
    render();

    try {
      await seedIfEmpty('menu', SEED.menu);
      await ensureHideoutMenuCatalog();
      await seedIfEmpty('tables', SEED.tables);
      await seedIfEmpty('inventory', SEED.inventory);
      await seedIfEmpty('suppliers', SEED.suppliers);
      await seedIfEmpty('staff', SEED.staff);
      await seedSettings();

      stopFirestoreListeners();
      attachListeners();
      startOnlineKOTPrintRetry();
      firebaseStatus = 'connected';
      firebaseError = '';
      render();
    } catch (error) {
      console.error('Firestore setup failed:', error);
      firestoreStartupPromise = null;
      firebaseStatus = 'error';
      firebaseError = error?.message || String(error);
      render();
    }
  })();

  return firestoreStartupPromise;
}

async function reconnectFirebase() {
  try {
    if (!db || !auth) {
      firebaseInitPromise = null;
      await ensureFirebaseInit();
      return;
    }
    stopFirestoreListeners();
    firestoreStartupPromise = null;
    if (!auth.currentUser) {
      const credential = await fa.signInAnonymously(auth);
      state.authUser = credential.user;
    } else {
      state.authUser = auth.currentUser;
    }
    firebaseDeviceUid = state.authUser?.uid || '';
    await startAuthenticatedFirestore();
  } catch (error) {
    console.error('Firebase reconnect failed:', error);
    firebaseStatus = 'error';
    firebaseError = error?.message || String(error);
    render();
  }
}

}

async function seedIfEmpty(name, items){
 // Do not reseed just because a collection becomes empty.
 // Otherwise deleting the last item makes it come back after refresh.
 const markerRef = fs.doc(db, 'appMeta', 'seed_'+name);
 const markerSnap = await fs.getDoc(markerRef);
 if(markerSnap.exists()) return;

 const snap = await fs.getDocs(fs.collection(db, name));
 if(snap.empty){
  for(const item of items){ await fs.addDoc(fs.collection(db, name), item); }
 }
 // This collection has now been initialized. Future refreshes will not
 // recreate records that the user intentionally added or deleted.
 await fs.setDoc(markerRef, {initialized:true, initializedAt:fs.serverTimestamp()});
}
async function seedSettings(){
 const ref = fs.doc(db, 'settings', 'main');
 const snap = await fs.getDoc(ref);
 if(!snap.exists()){
   await fs.setDoc(ref, {...state.settings,menuCategories:HIDEOUT_CATEGORY_ORDER,menuCatalogVersion:HIDEOUT_MENU_VERSION});
 }else{
   const data=snap.data()||{};
   state.settings={...state.settings,...data};
 }
}
async function ensureHideoutMenuCatalog(){
 const ref=fs.doc(db,'settings','main');
 const snap=await fs.getDoc(ref);
 const data=snap.exists()?(snap.data()||{}):{};
 const existing=await fs.getDocs(fs.collection(db,'menu'));
 // Never delete a live menu simply because a local catalog version differs.
 // Existing POS menu edits/prices are the source of truth and must be preserved.
 if(existing.empty){
   for(const item of HIDEOUT_MENU_CLEAN) await fs.addDoc(fs.collection(db,'menu'),{...item});
 }
 await fs.setDoc(ref,{...state.settings,...data,menuCategories:HIDEOUT_CATEGORY_ORDER,menuCatalogVersion:HIDEOUT_MENU_VERSION,publicMenuSyncRequestedAt:fs.serverTimestamp()},{merge:true});
}
function attachListeners(){
 subscribeSnapshot(fs.collection(db,'menu'), snap=>{
   const seen=new Set();
   const firestoreMenu=snap.docs.map(d=>({id:d.id,...d.data()}));
   state.menu=(firestoreMenu.length?firestoreMenu:SEED.menu.map(item=>({...item}))).filter(m=>{
     const cat=String(m.cat||'Other').trim();
     const name=String(m.name||'').trim().replace(/\s+/g,' ').toLowerCase();
     const key=`${cat.toLowerCase()}::${name}`;
     if(!name || HIDEOUT_BUILDER_ONLY_CATEGORIES.includes(cat) || seen.has(key)) return false;
     seen.add(key); return true;
   });
   render();
 }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'tables'), snap=>{ state.tables = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'inventory'), snap=>{ state.inventory = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
subscribeSnapshot(fs.query(fs.collection(db,'inventoryLogs'), fs.orderBy('createdAt','desc')), snap=>{ state.inventoryLogs = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>{ state.inventoryLogs=[]; console.warn('Inventory history unavailable',err); });
 subscribeSnapshot(fs.collection(db,'suppliers'), snap=>{ state.suppliers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'purchases'), fs.orderBy('createdAt','desc')), snap=>{ state.purchases = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'staff'), snap=>{ state.staff = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
  subscribeSnapshot(fs.collection(db,'customers'), snap=>{ state.customers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
  subscribeSnapshot(fs.query(fs.collection(db,'expenses'), fs.orderBy('createdAt','desc')), snap=>{ state.expenses = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'orders'), fs.orderBy('createdAt','desc')), snap=>{ state.orders = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'kots'), fs.orderBy('createdAt','desc')), snap=>{
  state.kots = snap.docs.map(d=>({id:d.id,...d.data()}));
  // Print only explicitly queued Digital Menu KOTs. Old historical KOTs do not
  // carry printStatus=pending, so reconnecting never reprints old tickets.
  schedulePendingOnlineKOTPrints();
  render();
 }, err=>connErr(err));
 subscribeSnapshot(fs.doc(db,'settings','main'), snap=>{
  if(snap.exists()){
   const d=snap.data(); state.settings = d;
   if(typeof d.autoPrintOnlineKots==='boolean') state.autoPrintOnlineKots=d.autoPrintOnlineKots;
  }
  schedulePendingOnlineKOTPrints();
  render();
 }, err=>connErr(err));
}

function pos(){
 const visibleMenu=state.menu.filter(m=>!HIDEOUT_BUILDER_ONLY_CATEGORIES.includes(String(m.cat||'').trim()));
 const cats=['All',...HIDEOUT_CATEGORY_ORDER.filter(c=>c!=='Combos' || visibleMenu.some(m=>m.cat==='Combos')), ...visibleMenu.map(m=>String(m.cat||'Other').trim()).filter(c=>c && !HIDEOUT_CATEGORY_ORDER.includes(c))];
 const uniqueCats=[...new Set(cats)];
 const reorderOrder=state.reorderBillId?state.orders.find(o=>o.id===state.reorderBillId):null;
 const baseItems=reorderOrder?.items||state.reorderBaseItems||[];
 const newItems=state.cart||[];
 const baseSubtotal=baseItems.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0);
 const newSubtotal=newItems.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0);
 const combinedSubtotal=baseSubtotal+newSubtotal;
 const discount=combinedSubtotal*(Number(state.settings.discount)||0)/100;
 const tax=(combinedSubtotal-discount)*state.settings.tax/100;
 const combinedTotal=combinedSubtotal-discount+tax;
 const currentDiscount=newSubtotal*(Number(state.settings.discount)||0)/100;

function isBuildYourOwnBurger(m){
 return /build\s*(your|ur)?\s*own\s*burger/i.test(String(m?.name||''));

function getPizzaVariantInfo(item){
 const name=String(item?.name||'Unnamed Pizza').trim();
 const match=name.match(/\s*[-–—]\s*(R|REGULAR|SMALL|S|M|MEDIUM|L|LARGE)\s*$/i);
 if(!match) return {baseName:name,sizeKey:null};
 const token=match[1].toUpperCase();
 const sizeKey=['R','REGULAR','SMALL','S'].includes(token)?'small':(['M','MEDIUM'].includes(token)?'medium':'large');
 return {baseName:name.replace(/\s*[-–—]\s*(R|REGULAR|SMALL|S|M|MEDIUM|L|LARGE)\s*$/i,'').trim(),sizeKey};
}
function groupPizzaVariants(items){
 const byName=new Map();
 const singles=[];
 for(const item of items){
  const info=getPizzaVariantInfo(item);
  if(!info.sizeKey){singles.push(item);continue;}
  const key=info.baseName.toLocaleLowerCase();
  if(!byName.has(key)) byName.set(key,{name:info.baseName,variants:{}});
  const group=byName.get(key);
  if(!group.variants[info.sizeKey]) group.variants[info.sizeKey]=item;
 }
 return {pizzas:[...byName.values()],singles};
}

 const grouped=groupPizzaVariants(allPizzas);
 const matchesSearch=(pizza)=>!search||[pizza.name,...Object.values(pizza.variants).flatMap(m=>[m.name,m.cat,m.station])].join(' ').toLowerCase().includes(search);
 const pizzas=grouped.pizzas.filter(matchesSearch);
 const singles=grouped.singles.filter(m=>!search||[m.name,m.cat,m.station].map(v=>String(v||'').toLowerCase()).join(' ').includes(search));
 const showBuilder=!search||'build your own pizza pizza'.includes(search);

 if(!pizzas.length&&!singles.length&&!buildCard) return `<div class="empty pos-empty">No menu item found for <b>${esc(state.posSearch||'this search')}</b></div>`;
 const sizeOrder=[{key:'small',label:'Small'},{key:'medium',label:'Medium'},{key:'large',label:'Large'}];
 const addFunction=state.reorderBillId?'addReorderCart':'addCart';
 const variantCards=pizzas.map(pizza=>`<article class="pizza-menu-card"><div class="pizza-card-top"><span class="pizza-card-emoji" aria-hidden="true">🍕</span><div class="pizza-card-copy"><div class="pizza-card-name">${esc(pizza.name)}</div><div class="pizza-card-subtitle">Choose a size to add it directly to the bill</div></div></div><div class="pizza-size-heading">SIZE &amp; PRICE</div><div class="pizza-size-options">${sizeOrder.map(size=>{const item=pizza.variants[size.key];return item?`<button type="button" class="pizza-size-btn" data-menu-id="${esc(item.id??item.name)}" aria-label="Add ${esc(pizza.name)} ${size.label} for ${esc(money(item.price))}" title="Add ${esc(pizza.name)} — ${size.label}" onclick="${addFunction}(this.dataset.menuId)"><span class="pizza-size-label">${size.label}</span><b class="pizza-size-price">${money(item.price)}</b></button>`:`<button type="button" class="pizza-size-btn" disabled aria-label="${size.label} unavailable for ${esc(pizza.name)}"><span class="pizza-size-label">${size.label}</span><b class="pizza-size-price">Unavailable</b></button>`;}).join('')}</div></article>`).join('');
 const singleCards=singles.map(item=>`<article class="pizza-menu-card"><div class="pizza-card-top"><span class="pizza-card-emoji" aria-hidden="true">🍕</span><div class="pizza-card-copy"><div class="pizza-card-name">${esc(item.name)}</div><div class="pizza-card-subtitle">Pizza menu item</div></div></div><div class="pizza-single-note">Size variants are not configured for this item.</div><div class="pizza-single-actions"><b class="price">${money(item.price)}</b><button type="button" class="btn primary" data-menu-id="${esc(item.id??item.name)}" onclick="${addFunction}(this.dataset.menuId)">Add</button></div></article>`).join('');
 const count=pizzas.length+singles.length;

function addReorderCart(id){

// Builds the kitchen-ticket HTML for a given order/KOT source.
// Shared by the manual "Print KOT" button (printKOT, opens a real window —
// needs a user click) and the silent auto-print path for online orders
// (autoPrintKOTSilently, prints through a hidden iframe so it isn't blocked
// as a popup since it has no click behind it).
function buildKotTicketHTML(source, forAutoPrint){
  const ticketItems=Array.isArray(source.items)?source.items.filter(item=>item && Number(item.qty||0)>0):[];
  if(!ticketItems.length) return null;

  const configuredWidth=Number(state.settings?.kotWidth||79);
  const width=[58,79].includes(configuredWidth)?configuredWidth:79;
  const sourceCode=String(source.code||'');
  const isKotRecord=/^KOT-\d+$/i.test(sourceCode);
  const kotCode=String(source.kotCode || (isKotRecord?sourceCode:'') || nextKotCode());
  const kotNumber=kotCode.replace(/^KOT-/i,'');
  const orderCode=String(source.order || (!isKotRecord?sourceCode:'')).trim();
  const orderType=source.reorder || String(source.type||'').toUpperCase()==='REORDER'
    ? 'REORDER'
    : String(source.type || (source.table && source.table!=='—'?'DINE-IN':'ORDER')).toUpperCase();
  const displayType={
    'DINE-IN':'DINE-IN',
    'TAKEAWAY':'TAKEAWAY',
    'DELIVERY':'DELIVERY',
    'REORDER':'REORDER',
    'ORDER':'ORDER'
  }[orderType] || 'ORDER';
  const table=String(source.table||'—');
  const date=String(source.date||new Date().toLocaleDateString('en-GB'));
  const time=String(source.time||new Date().toLocaleTimeString());
  const items=ticketItems.map(item=>{
    const name=esc(item.name||'Unnamed item');
    const quantity=Math.max(0,Number(item.qty)||0);
    const note=String(item.note||'').trim();
    const noteHtml=note?`<div class="note"><b>NOTE:</b> ${esc(note).replace(/\r?\n/g,'<br>')}</div>`:'';
    return `<tr class="item-row"><td class="itemcol"><div class="itemname">${name}</div>${noteHtml}</td><td class="qtycol">x ${quantity}</td></tr>`;
  }).join('');

  const printId=JSON.stringify(String(source.id||''));
  const printScript=forAutoPrint
    ? `window.addEventListener('afterprint',function(){try{window.parent.postMessage({type:'FH_KOT_PRINT_FINISHED',id:${printId}},window.location.origin);}catch(e){}});window.addEventListener('load',function(){setTimeout(function(){window.print();},150)});`
    : `window.addEventListener('load',function(){window.focus();setTimeout(function(){window.print();},200)});window.addEventListener('afterprint',function(){window.close()});`;
  const html=`<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOT #${esc(kotNumber)}</title>
<style>

  return {html,kotNumber};
}

// Manual print — used by the "Print KOT" buttons. Opens a real window,
// which is fine here because it's always triggered by a user click.
function printKOT(customOrder=null){
  const source=customOrder || {
    items:state.cart,
    code:nextBillCode(),
    type:state.orderType,
    table:state.orderType==='DINE-IN'?state.selectedTable:'—',
    time:new Date().toLocaleTimeString()
  };
  const built=buildKotTicketHTML(source,false);
  if(!built) return toast('Add items first');
  const w=window.open('','_blank','width=420,height=760');
  if(!w) return toast('Allow pop-ups to print KOT');
  w.document.open();
  w.document.write(built.html);
  w.document.close();
}

// Silent auto-print — used for online/QR orders. There's no click behind
// this call (it fires from a Firestore listener), so window.open() would be
// blocked as a popup by the browser. Instead we reuse one hidden <iframe>
// that's already part of the page and print through that, which browsers
// allow without a user gesture.
let autoPrintFrame=null;
function getAutoPrintFrame(){
  if(autoPrintFrame && document.body.contains(autoPrintFrame)) return autoPrintFrame;
  const f=document.createElement('iframe');
  f.id='kotAutoPrintFrame';
  f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(f);
  autoPrintFrame=f;
  return f;
}
function autoPrintKOTSilently(source){
  const built=buildKotTicketHTML(source,true);
  if(!built) return false;
  const f=getAutoPrintFrame();
  const doc=f.contentWindow.document;
  doc.open();
  doc.write(built.html);
  doc.close();
  return true;
}
async function claimOnlineKOTForPrint(kotId){
  if(!firebaseReady()) return false;
  const ref=fs.doc(db,'kots',kotId);
  try{
    return await fs.runTransaction(db,async transaction=>{
      const snap=await transaction.get(ref);
      if(!snap.exists()) return false;
      const data=snap.data()||{};
      if(data.printStatus==='printed') return false;
      if(data.printStatus==='printing'){
        const claimedAt=data.printClaimedAt?.toMillis?.()||0;
        if(claimedAt && Date.now()-claimedAt<300000) return false;
      }else if(data.printStatus!=='pending'){
        return false;
      }
      transaction.update(ref,{
        printStatus:'printing',
        printClaimedAt:fs.serverTimestamp(),
        printClaimedBy:auth?.currentUser?.uid||'pos-staff'
      });
      return true;
    });
  }catch(error){console.error('Could not claim online KOT for printing:',error);return false;}
}

async function processOnlineKOTPrint(kot){
  if(!state.autoPrintOnlineKots || !kot?.id || autoPrintKotsInFlight.has(kot.id)) return;
  autoPrintKotsInFlight.add(kot.id);
  try{
    const claimed=await claimOnlineKOTForPrint(kot.id);
    if(!claimed) return;
    const printed=autoPrintKOTSilently({...kot,id:kot.id,kotCode:kot.kotCode||kot.code,order:kot.order});
    if(!printed){
      await fs.updateDoc(fs.doc(db,'kots',kot.id),{printStatus:'pending',printClaimedAt:null,printClaimedBy:null});
      return;
    }
    toast(`🔔 Online order ${kot.order||''} — KOT sent to printer`);
  }catch(error){
    console.error('Online KOT auto-print error:',error);
    try{await fs.updateDoc(fs.doc(db,'kots',kot.id),{printStatus:'pending',printClaimedAt:null,printClaimedBy:null});}catch(_){ }
  }finally{
    autoPrintKotsInFlight.delete(kot.id);
  }
}

function schedulePendingOnlineKOTPrints(){
  if(!state.autoPrintOnlineKots || !db || !fs || firebaseStatus!=='connected') return;
  (state.kots||[]).forEach(k=>{
    if(k.source==='online-menu' && k.autoPrint && ['pending','printing'].includes(String(k.printStatus||''))){
      processOnlineKOTPrint(k);
    }
  });
}

// Re-check the queue periodically. If the POS browser closes after claiming a
// KOT but before the print dialog completes, the stale claim can be recovered.
let onlineKOTPrintRetryTimer=null;
function startOnlineKOTPrintRetry(){
  if(onlineKOTPrintRetryTimer) return;
  onlineKOTPrintRetryTimer=setInterval(schedulePendingOnlineKOTPrints,15000);
}

window.addEventListener('message',event=>{
  if(event.origin!==window.location.origin) return;
  const data=event.data||{};
  if(data.type!=='FH_KOT_PRINT_FINISHED' || !data.id || !firebaseReady()) return;
  fs.updateDoc(fs.doc(db,'kots',String(data.id)),{
    printStatus:'printed',
    printedAt:fs.serverTimestamp(),
    printClaimedAt:null,
    printClaimedBy:null
  }).catch(error=>console.error('Could not record KOT print completion:',error));
});

function printReceipt(order,customer){
  const w=window.open('','_blank','width=420,height=800');
  if(!w) return toast('Allow pop-ups to print receipt');
  w.document.write(receiptHtml(order,customer));
  w.document.close();

async function deductRecipeInventory(cartItems, batch){
  const deductions=new Map();
  for(const cartItem of cartItems){
    const qtySold=Number(cartItem.qty||0);
    if(!qtySold) continue;
    const recipe=Array.isArray(cartItem.recipe)?cartItem.recipe:[];
    for(const ingredient of recipe){
      const inventoryId=String(ingredient?.inventoryId||'').trim();
      const perItemQty=Number(ingredient?.qty);
      if(!inventoryId || !Number.isFinite(perItemQty) || perItemQty<=0) continue;
      const amount=perItemQty*qtySold;
      deductions.set(inventoryId,(deductions.get(inventoryId)||0)+amount);
    }
  }
  for(const [inventoryId,amount] of deductions.entries()){
    const ref=fs.doc(db,'inventory',inventoryId);
    batch.update(ref,{qty:fs.increment(-amount),updatedAt:fs.serverTimestamp(),lastDeduction:`Sale / recipe deduction: ${amount}`});
    const inv=state.inventory.find(x=>String(x.id)===String(inventoryId));
    batch.set(fs.doc(fs.collection(db,'inventoryLogs')),{type:'sale_recipe',ingredient:inv?.name||inventoryId,ingredientId:inventoryId,qty:amount,delta:-amount,reason:'Automatic recipe deduction from completed sale',date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()});
  }
  return deductions;
}
async function completePay(total,saveDetails=true){
  if(!firebaseReady()) return;
  const payMethod=document.getElementById('payMethod')?.value||'Cash';
  const isHouseComp=payMethod==='House / Family (Comp)';
  const customerName=(state.pendingCustomer?.name || document.getElementById('custName')?.value || '').trim();
  const customerMobile=(state.pendingCustomer?.mobile || document.getElementById('custMobile')?.value || '').replace(/\D/g,'');
  const subtotal=state.cart.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0);
  const discount=subtotal*(Number(state.settings.discount)||0)/100;
  const tax=(subtotal-discount)*Number(state.settings.tax||0)/100;
  const normalTotal=subtotal-discount+tax;
  const recordedSubtotal=isHouseComp?0:subtotal;
  const recordedDiscount=isHouseComp?0:discount;
  const recordedTax=isHouseComp?0:tax;
  const recordedTotal=isHouseComp?0:normalTotal;
  const now=new Date();
  const cartItems=state.cart.map(x=>({id:x.id,name:x.name,price:Number(x.price||0),cost:Number(x.cost||0),qty:Number(x.qty||0),note:String(x.note||'').trim(),recipe:Array.isArray(x.recipe)?x.recipe.map(r=>({inventoryId:String(r?.inventoryId||''),qty:Number(r?.qty||0)})).filter(r=>r.inventoryId&&r.qty>0):[]}));
  if(customerMobile && customerMobile.length<10) return toast('Enter a valid 10-digit mobile number');
  if(customerMobile && !customerName) return toast('Enter customer name');
  if(!cartItems.length) return toast('Cart is empty');
  try{
    if(saveDetails && customerMobile && customerName && !state.pendingCustomer) await saveCustomer(customerName,customerMobile);

    const batch=fs.writeBatch(db);
    const orderRef=fs.doc(fs.collection(db,'orders'));
    const orderDoc={
      code:nextBillCode(),kotCode:nextKotCode(),total:recordedTotal,subtotal:recordedSubtotal,discount:recordedDiscount,tax:recordedTax,payment:payMethod,
      isComp:isHouseComp,compType:isHouseComp?'House / Family (Comp)':'',
      time:now.toLocaleTimeString(),date:now.toLocaleDateString('en-IN'),
      type:state.orderType,table:state.selectedTable,items:cartItems,
      customerName:customerName||'',customerMobile:customerMobile||'',cashier:localStorage.getItem('hideout_cashier')||'biller',createdAt:fs.serverTimestamp()
    };
    batch.set(orderRef,orderDoc);

    for(const item of cartItems){
      if(item.id){
        batch.update(fs.doc(db,'menu',item.id),{sold:fs.increment(item.qty)});
      }
    }
    const deductions=await deductRecipeInventory(cartItems,batch);
    await batch.commit();

    if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table') delete state.tableCarts[state.selectedTable];
    state.cart=[];
    state.pendingCustomer=null;
    closeModal();
    printKOT(orderDoc);
    toast(isHouseComp?'House / Family order saved at ₹0 & KOT printing':(saveDetails?'Bill saved & KOT printing':'KOT printing'));
    go('dashboard');
  }catch(e){
    console.error('Complete payment error:',e);
    toast('Could not complete the order. No bill or inventory deduction was applied.');
  }
}

function holdBill(){
  if(!state.cart.length) return toast('Nothing to hold');

  const defaultRef=(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table')
    ? state.selectedTable
    : `Bill-${Date.now()}`;
  const input=prompt('Enter a reference name for this held bill:',defaultRef);
  if(input===null) return;
  const reference=input.trim()||defaultRef;

  let held={};
  try{
    const raw=JSON.parse(localStorage.getItem('hideout_held')||'{}');
    if(raw && typeof raw==='object' && !Array.isArray(raw)) held=raw;
    else if(Array.isArray(raw) && raw.length) held[defaultRef]={reference:defaultRef,table:state.selectedTable||'—',orderType:state.orderType,cart:raw};
  }catch(e){ held={}; }

  if(held[reference] && !confirm(`A held bill named "${reference}" already exists. Replace it?`)) return;

  held[reference]={
    reference,
    table:state.selectedTable||'—',
    orderType:state.orderType,
    cart:state.cart.map(i=>({...i,qty:Math.max(1,Number(i.qty)||1),note:String(i.note||'')})),
    createdAt:Date.now()
  };
  localStorage.setItem('hideout_held',JSON.stringify(held));

  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    delete state.tableCarts[state.selectedTable];
  }
  state.cart=[];
  state.reorderBillId=null;
  state.reorderBaseItems=[];
  state.reorderNewItems=[];
  toast(`Bill held as "${reference}"`);
  render();
}

function retrieveBill(){
  let held={};
  try{
    const raw=JSON.parse(localStorage.getItem('hideout_held')||'{}');
    if(raw && typeof raw==='object' && !Array.isArray(raw)) held=raw;
    else if(Array.isArray(raw) && raw.length){
      const fallbackRef=(state.orderType==='DINE-IN' && state.selectedTable)?state.selectedTable:`Bill-${Date.now()}`;
      held[fallbackRef]={reference:fallbackRef,table:state.selectedTable||'—',orderType:state.orderType,cart:raw};
    }
  }catch(e){
    localStorage.removeItem('hideout_held');
    return toast('Held bill data was invalid and has been cleared');
  }

  const refs=Object.keys(held).filter(k=>Array.isArray(held[k]?.cart) && held[k].cart.length);
  if(!refs.length) return toast('No held bills');

  const defaultRef=(state.selectedTable && refs.includes(state.selectedTable))?state.selectedTable:refs[0];
  const input=prompt(`Enter the held bill reference to retrieve.\nAvailable: ${refs.join(', ')}`,defaultRef);
  if(input===null) return;
  const requested=input.trim()||defaultRef;
  const reference=refs.find(k=>k.toLowerCase()===requested.toLowerCase());
  if(!reference) return toast(`No held bill found for "${requested}"`);

  // Preserve any unsaved work on the currently selected table before replacing the active cart.
  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    state.tableCarts[state.selectedTable]=state.cart.map(i=>({...i}));
  }

  const bill=held[reference];
  const restoredTable=bill.table && bill.table!=='—' ? String(bill.table) : state.selectedTable;
  state.orderType=bill.orderType||'DINE-IN';
  if(state.orderType==='DINE-IN' && restoredTable && restoredTable!=='Select table') state.selectedTable=restoredTable;
  state.cart=bill.cart.map(i=>({...i,qty:Math.max(1,Number(i.qty)||1),note:String(i.note||'')}));

  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    state.tableCarts[state.selectedTable]=state.cart.map(i=>({...i}));
  }

  delete held[reference];
  localStorage.setItem('hideout_held',JSON.stringify(held));
  state.reorderBillId=null;
  state.reorderBaseItems=[];
  state.reorderNewItems=[];
  state.pendingCustomer=null;
  toast(`Held bill "${reference}" retrieved`);
  render();
}

function getCustomerDirectory(){

    map.set(mobile,{...c,mobile});
  });

  // customer document was created before the Customers section existed.
  (state.orders||[]).forEach(o=>{

    const existing=map.get(mobile)||{mobile,name:o.customerName||'Customer'};

  return [...map.values()].map(c=>{

async function submitReorder(){
  if(!firebaseReady()) return;
  const r=state.orders.find(x=>x.id===state.reorderBillId); if(!r) return toast('Original bill not found');
  if(!state.cart.length) return toast('Add the new reorder items first');
  const newItems=state.cart.map(x=>({id:x.id,name:x.name,price:Number(x.price||0),cost:Number(x.cost||0),qty:Number(x.qty||0),note:String(x.note||'').trim()}));
  const combinedItems=[...(r.items||[]),...newItems];
  const subtotal=combinedItems.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0);
  const discount=subtotal*(Number(state.settings.discount)||0)/100;
  const tax=(subtotal-discount)*state.settings.tax/100; const total=subtotal-discount+tax;
  await fs.updateDoc(fs.doc(db,'orders',r.id),{items:combinedItems,subtotal,discount,tax,total,reorderCount:Number(r.reorderCount||0)+1,lastReorderAt:fs.serverTimestamp(),lastReorderItems:newItems});
  const kotDoc={code:nextKotCode(),order:r.code,orderId:r.id,table:r.type==='DINE-IN'?r.table:'—',items:newItems.map(x=>({name:x.name,qty:x.qty,note:x.note,price:x.price})),status:'New',time:new Date().toLocaleTimeString(),type:'REORDER',createdAt:fs.serverTimestamp()};
  await fs.addDoc(fs.collection(db,'kots'),kotDoc);
  for(const item of newItems){if(item.id){try{await fs.updateDoc(fs.doc(db,'menu',item.id),{sold:fs.increment(item.qty)});}catch(e){console.error(e)}}}
  const printSource={...r,items:newItems,table:r.table||'—',type:r.type||'DINE-IN',time:new Date().toLocaleTimeString(),kotCode:kotDoc.code,reorder:true};
  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    delete state.tableCarts[state.selectedTable];
  }
  state.cart=[];state.reorderBillId=null;state.reorderBaseItems=[];state.reorderNewItems=[];state.pendingCustomer=null;
  printKOT(printSource); toast(`${newItems.length} new item(s) added to ${r.code}. KOT printed. New bill total: ${money(total)}`); go('orders');
}

function syncRecipeEmptyState(){
 const list=document.getElementById('recipeList');
 if(!list) return;
 const rows=[...list.querySelectorAll('[data-recipe-row]')];
 const empty=list.querySelector('#recipeEmpty');
 if(!rows.length && !empty){
   const d=document.createElement('div'); d.className='recipe-empty'; d.id='recipeEmpty'; d.textContent='No ingredients added. Click "＋ Add Ingredient" to define the recipe.'; list.appendChild(d);
 }else if(rows.length && empty){empty.remove();}
}
function collectRecipe(){
 const rows=[...document.querySelectorAll('#recipeList [data-recipe-row]')];
 const recipe=[]; const seen=new Set();
 for(const row of rows){
   const inventoryId=String(row.querySelector('.recipe-inventory')?.value||'').trim();
   const qty=Number(row.querySelector('.recipe-qty')?.value);
   if(!inventoryId && !Number.isFinite(qty)) continue;
   if(!inventoryId) return {error:'Select an inventory item for every recipe row'};
   if(!Number.isFinite(qty)||qty<=0) return {error:'Enter a valid recipe quantity for every ingredient'};
   if(seen.has(inventoryId)) return {error:'The same inventory item cannot be added twice'};
   seen.add(inventoryId); recipe.push({inventoryId,qty});
 }
 return {recipe};
}

let inventoryMonth = new Date().toISOString().slice(0,7);
function inventory(){
 const ym=inventoryMonth||new Date().toISOString().slice(0,7);
 const logs=(state.inventoryLogs||[]).filter(l=>String(l.date||l.createdAt?.toDate?.()?.toISOString?.()||'').slice(0,7)===ym);
 const purchases=logs.filter(l=>l.type==='purchase'), wastageLogs=logs.filter(l=>l.type==='wastage'), adjustments=logs.filter(l=>l.type==='adjustment');
 const purchasedQty=purchases.reduce((a,l)=>a+Number(l.qty||0),0), wastedQty=wastageLogs.reduce((a,l)=>a+Number(l.qty||0),0), adjustmentQty=adjustments.reduce((a,l)=>a+Number(l.delta||0),0), purchaseSpend=purchases.reduce((a,l)=>a+Number(l.amount||0),0);
 const monthLabel=new Date(ym+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
 const search=String(window.inventorySearch||'').trim().toLowerCase();
 const filtered=state.inventory.filter(x=>{const hay=[x.name,x.cat,x.unit].map(v=>String(v||'').toLowerCase()).join(' ');return !search||hay.includes(search)});
 const categories=[...new Set(filtered.map(x=>String(x.cat||'Other').trim()||'Other'))].sort((a,b)=>a.localeCompare(b));
 const low=state.inventory.filter(x=>Number(x.qty||0)<=Number(x.min||0)).length;
 return pageTitle('Inventory',`Organized ingredient stock • purchases, wastage and adjustments are tracked separately`)+`<div class="card"><div class="inventory-toolbar"><input class="input" value="${esc(search)}" placeholder="🔎 Search ingredient, category or unit..." oninput="filterInventory(this.value)"><button class="btn primary" onclick="addInventory()">＋ Add Ingredient</button><button class="btn" onclick="stockAdjust()">＋ Stock Adjustment</button><button class="btn" onclick="wastage()">Record Wastage</button><label style="display:flex;align-items:center;gap:7px"><span class="muted">Month</span><input class="input" type="month" value="${ym}" onchange="inventoryMonth=this.value;render()"></label></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="badge warn">${low} Low Stock</span><span class="badge blue">${state.inventory.length} Ingredients</span><span class="badge good">Stock Value ${money(state.inventory.reduce((a,x)=>a+Number(x.qty||0)*Number(x.cost||0),0))}</span></div>
 <div class="grid three section"><div class="card"><span class="muted">${monthLabel} Purchases</span><h2>${money(purchaseSpend)}</h2><small>${purchasedQty} units received</small></div><div class="card"><span class="muted">Wastage</span><h2>${wastedQty}</h2><small>units recorded</small></div><div class="card"><span class="muted">Net Adjustments</span><h2>${adjustmentQty>=0?'+':''}${adjustmentQty}</h2><small>stock corrections</small></div></div>
 <div class="section">${categories.length?categories.map(cat=>{const items=filtered.filter(x=>(String(x.cat||'Other').trim()||'Other')===cat);return `<div class="inventory-category"><div class="inventory-category-title"><h3>${esc(cat)}</h3><span>${items.length} ingredient${items.length===1?'':'s'}</span></div><div class="table-wrap"><table class="data"><thead><tr><th>Ingredient</th><th>Current Stock</th><th>Minimum</th><th>Unit</th><th>Cost / Unit</th><th>Stock Value</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(x=>{const isLow=Number(x.qty||0)<=Number(x.min||0);return `<tr class="${isLow?'inventory-low':'inventory-ok'}"><td><b>${esc(x.name)}</b></td><td class="stock-number">${Number(x.qty||0)}</td><td>${Number(x.min||0)}</td><td>${esc(x.unit||'unit')}</td><td>${money(x.cost||0)}</td><td>${money(Number(x.qty||0)*Number(x.cost||0))}</td><td><span class="badge ${isLow?'warn':'good'}">${isLow?'Low Stock':'OK'}</span></td><td style="display:flex;gap:6px"><button class="btn" onclick="editInventory('${x.id}')">Edit</button><button class="btn" onclick="stockAdjustFor('${x.id}')">Adjust</button><button class="btn danger" onclick="deleteInventory('${x.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div></div>`}).join(''):'<div class="card empty">No ingredients match your search.</div>'}</div>
 <div class="card section"><div class="section-title"><h2>Monthwise Inventory Activity — ${monthLabel}</h2><span class="muted">${logs.length} entries</span></div><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Ingredient</th><th>Type</th><th>Quantity</th><th>Stock After</th><th>Amount</th><th>Details</th></tr></thead><tbody>${logs.length?logs.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(l=>`<tr><td>${esc(l.date||'—')}</td><td><b>${esc(l.ingredient||'—')}</b></td><td><span class="badge ${l.type==='wastage'?'warn':l.type==='purchase'?'good':'blue'}">${esc(l.type||'activity')}</span></td><td>${Number(l.qty||l.delta||0)}</td><td>${Number(l.qtyAfter??0)}</td><td>${Number(l.amount||0)?money(l.amount):'—'}</td><td>${esc(l.reason||'—')}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">No inventory activity recorded for ${monthLabel} yet.</td></tr>`}</tbody></table></div></div></div>`;

async function saveInventory(id=null){
 const name=document.getElementById('invn')?.value.trim(); if(!name) return toast('Enter an ingredient name');
 const qty=Math.max(0,Number(document.getElementById('invq')?.value)||0), min=Math.max(0,Number(document.getElementById('invm')?.value)||0), cost=Math.max(0,Number(document.getElementById('invcost')?.value)||0);
 const cat=document.getElementById('invc')?.value.trim()||'Other', unit=document.getElementById('invu')?.value||'unit';
 const duplicate=state.inventory.find(x=>x.id!==id && String(x.name||'').trim().toLowerCase()===name.toLowerCase());
 if(duplicate) return toast('Ingredient already exists');
 const data={name,cat,unit,qty,min,cost,updatedAt:fs.serverTimestamp()};
 try{if(id){await fs.updateDoc(fs.doc(db,'inventory',id),data);toast('Ingredient updated')}else{const ref=await fs.addDoc(fs.collection(db,'inventory'),{...data,createdAt:fs.serverTimestamp()});await fs.addDoc(fs.collection(db,'inventoryLogs'),{type:'opening',ingredient:name,ingredientId:ref.id,qty:Number(data.qty||0),qtyAfter:Number(data.qty||0),amount:Number(data.qty||0)*Number(data.cost||0),reason:'Opening stock',date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()});toast('Ingredient added')} closeModal();}catch(e){toast('Could not save ingredient');console.error(e)}
}
function stockAdjust(){
 if(!state.inventory.length) return toast('Add an ingredient first');
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Stock Adjustment</h2><div class="formgrid"><label>Ingredient<select id="si" class="select">${state.inventory.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${x.unit||'unit'})</option>`).join('')}</select></label><label>Quantity Change<input id="sq" class="input" type="number" step="0.01" placeholder="Use + to add, − to remove"></label><label class="full">Reason<textarea id="sr" placeholder="e.g. opening stock correction"></textarea></label></div><div class="actions"><button class="btn primary" onclick="applyStock()">Save Adjustment</button></div>`)
}
async function applyStock(){
 const item=state.inventory.find(i=>i.id===document.getElementById('si')?.value); const amount=Number(document.getElementById('sq')?.value);
 if(!item) return toast('Select an ingredient'); if(!Number.isFinite(amount)||amount===0) return toast('Enter a non-zero quantity');
 if(Number(item.qty||0)+amount<0) return toast('Stock cannot go below zero');
 try{const before=Number(item.qty||0), after=before+amount, reason=document.getElementById('sr')?.value.trim()||'Manual adjustment';await fs.updateDoc(fs.doc(db,'inventory',item.id),{qty:fs.increment(amount),lastAdjustment:reason,updatedAt:fs.serverTimestamp()});await fs.addDoc(fs.collection(db,'inventoryLogs'),{type:'adjustment',ingredient:item.name,ingredientId:item.id,delta:amount,qty:Math.abs(amount),qtyAfter:after,reason,date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()});closeModal();toast('Stock updated')}catch(e){toast('Could not update stock');console.error(e)}
}

 try{await fs.deleteDoc(fs.doc(db,'inventory',id));toast('Inventory item deleted')}catch(e){toast('Could not delete inventory item');console.error(e)}

async function saveWastage(){
 const item=state.inventory.find(i=>i.id===document.getElementById('wi')?.value); const qty=Number(document.getElementById('wq')?.value);
 if(!item) return toast('Select an ingredient'); if(!Number.isFinite(qty)||qty<=0) return toast('Enter a valid quantity'); if(qty>Number(item.qty||0)) return toast('Wastage cannot exceed current stock');
 try{const before=Number(item.qty||0), after=before-qty, reason=document.getElementById('wr')?.value.trim()||'No reason given';await fs.updateDoc(fs.doc(db,'inventory',item.id),{qty:fs.increment(-qty),lastAdjustment:`Wastage: ${reason}`,updatedAt:fs.serverTimestamp()});await fs.addDoc(fs.collection(db,'inventoryLogs'),{type:'wastage',ingredient:item.name,ingredientId:item.id,qty,qtyAfter:after,amount:qty*Number(item.cost||0),reason,date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()});closeModal();toast('Wastage recorded')}catch(e){toast('Could not record wastage');console.error(e)}
}

async function savePurchase(){
 const total=Number(document.getElementById('put')?.value), received=Number(document.getElementById('puq')?.value||0);
 if(!Number.isFinite(total)||total<=0) return toast('Enter a valid total amount');
 if(!Number.isFinite(received)||received<0) return toast('Enter a valid quantity');
 const invoice=document.getElementById('pui')?.value.trim()||('PO-'+(1000+state.purchases.length));
 const supplierName=document.getElementById('pus')?.value, payment=document.getElementById('pup')?.value;
 const inv=state.inventory.find(i=>i.name===document.getElementById('puin')?.value);
 try{
  await fs.addDoc(fs.collection(db,'purchases'), {invoice,supplier:supplierName,date:new Date().toLocaleDateString('en-IN'),items:1,ingredient:inv?.name||'',quantity:received,total,payment,createdAt:fs.serverTimestamp()});
  if(inv && received>0){
   const oldQty=Number(inv.qty||0), oldCost=Number(inv.cost||0), newQty=oldQty+received;
   const newCost=newQty>0?((oldQty*oldCost)+total)/newQty:oldCost;
   await fs.updateDoc(fs.doc(db,'inventory',inv.id), {qty:fs.increment(received),cost:newCost,updatedAt:fs.serverTimestamp()});await fs.addDoc(fs.collection(db,'inventoryLogs'),{type:'purchase',ingredient:inv.name,ingredientId:inv.id,qty:received,qtyAfter:oldQty+received,amount:total,reason:`Purchase ${invoice}`,date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()});
  }
  const sup=state.suppliers.find(s=>s.name===supplierName);
  if(sup) await fs.updateDoc(fs.doc(db,'suppliers',sup.id), {purchases:fs.increment(total),outstanding:fs.increment(payment==='Pending'?total:0)});
  closeModal();toast('Purchase saved');
 }catch(e){toast('Could not save purchase');console.error(e)}
}

async function deleteSupplier(id){
 const s=state.suppliers.find(x=>x.id===id); if(!s) return;
 const bills=state.purchases.filter(p=>p.supplier===s.name).length;
 if((s.outstanding||0)>0 && !confirm(`${s.name} still has ${money(s.outstanding)} outstanding. Delete anyway?`)) return;

 await fs.deleteDoc(fs.doc(db,'suppliers',id));

}

async function savePayment(id){
 const s=state.suppliers.find(x=>x.id===id); const amt=Number(pmA.value);
 if(!s) return toast('Supplier not found');
 if(!Number.isFinite(amt)||amt<=0) return toast('Enter a valid payment amount');

 await fs.updateDoc(fs.doc(db,'suppliers',id), {outstanding: fs.increment(-amt)});
 closeModal(); toast('Payment recorded');
}

function expenseDateKey(expense){
  try{
    if(expense.createdAt && typeof expense.createdAt.toDate==='function'){
      return dateKeyLocal(expense.createdAt.toDate());
    }
    if(expense.createdAt && typeof expense.createdAt.seconds==='number'){
      return dateKeyLocal(new Date(expense.createdAt.seconds*1000));
    }
    if(expense.dateKey) return String(expense.dateKey);

    const raw=String(expense.date||'').trim();
    let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){
      return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    }
    m=raw.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(m){
      return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }
  }catch(e){
    console.error('Expense date parsing error:',e);
  }
  return '';
}

function expenseDisplayDate(expense){
  try{
    if(expense.createdAt && typeof expense.createdAt.toDate==='function'){
      return expense.createdAt.toDate().toLocaleString('en-IN');
    }
    if(expense.createdAt && typeof expense.createdAt.seconds==='number'){
      return new Date(expense.createdAt.seconds*1000).toLocaleString('en-IN');
    }
  }catch(e){}
  return `${expense.date||'—'}${expense.time?` • ${expense.time}`:''}`;
}

function expenses(){
  const now=new Date();
  const todayKey=dateKeyLocal(now);
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const rows=[...(state.expenses||[])];

  const totalToday=rows.reduce((sum,x)=>{
    return sum+(expenseDateKey(x)===todayKey?Number(x.amount||0):0);
  },0);

  const totalMonth=rows.reduce((sum,x)=>{
    return sum+(expenseDateKey(x).startsWith(monthKey)?Number(x.amount||0):0);
  },0);

  const totalRecorded=rows.reduce(
    (sum,x)=>sum+Number(x.amount||0),0
  );

  return pageTitle(
    'Expenses',
    'Track daily spending, operating costs and other business expenses'
  )+`
    <div class="grid three">
      <div class="card stat">
        <div class="label">TOTAL EXPENSES TODAY</div>
        <div class="value">${money(totalToday)}</div>
        <div class="muted">Today's recorded spending</div>
      </div>

      <div class="card stat">
        <div class="label">TOTAL THIS MONTH</div>
        <div class="value">${money(totalMonth)}</div>
        <div class="muted">Current month's expenses</div>
      </div>

      <div class="card stat">
        <div class="label">TOTAL RECORDED</div>
        <div class="value">${money(totalRecorded)}</div>
        <div class="muted">${rows.length} expense${rows.length===1?'':'s'} recorded</div>
      </div>
    </div>

    <div class="card section">
      <div class="section-title">
        <div>
          <h2>Expense Sheet</h2>
          <div class="muted">Milk, electricity, raw material, maintenance and other spending</div>
        </div>
        <div class="filters">
          <button class="btn primary" onclick="addExpense()">＋ Add Expense</button>
          <button class="btn" onclick="manageCategories()">Manage Categories</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>Date &amp; Time</th>
              <th>Particulars</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length?rows.map(x=>`
              <tr>
                <td>${esc(expenseDisplayDate(x))}</td>
                <td><b>${esc(x.particulars||x.desc||'—')}</b></td>
                <td><span class="badge blue">${esc(x.cat||'Other')}</span></td>
                <td><b>${money(Number(x.amount||0))}</b></td>
                <td>
                  <button class="btn danger" onclick="deleteExpense('${esc(x.id)}')">Delete</button>
                </td>
              </tr>
            `).join(''):`
              <tr>
                <td colspan="5" class="empty">No expenses recorded yet.</td>
              </tr>
            `}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function saveExpense(){
  if(!firebaseReady()) return;

  const particulars=String(
    document.getElementById('expenseParticulars')?.value||''
  ).trim();

  const category=String(
    document.getElementById('expenseCategory')?.value||'Other'
  ).trim();

  const amount=Number(
    document.getElementById('expenseAmount')?.value
  );

  if(!particulars) return toast('Enter the expense particulars');
  if(!Number.isFinite(amount)||amount<=0){
    return toast('Enter a valid positive amount');
  }

  try{
    const now=new Date();

    await fs.addDoc(fs.collection(db,'expenses'),{
      particulars,
      desc:particulars,
      cat:category||'Other',
      amount,
      date:now.toLocaleDateString('en-IN'),
      time:now.toLocaleTimeString('en-IN'),
      dateKey:dateKeyLocal(now),
      createdAt:fs.serverTimestamp()
    });

    closeModal();
    toast('Expense saved');
  }catch(err){
    console.error('Save expense error:',err);
    toast('Unable to save expense');
  }
}

async function deleteExpense(id){
  if(!firebaseReady()) return;

  const expense=state.expenses.find(
    x=>String(x.id)===String(id)
  );

  if(!expense) return toast('Expense not found');

  const particulars=expense.particulars||expense.desc||'this expense';
  const amount=Number(expense.amount||0);

  if(!confirm(`Delete "${particulars}" for ${money(amount)}?`)) return;

  try{
    await fs.deleteDoc(fs.doc(db,'expenses',id));
    toast('Expense deleted');
  }catch(err){
    console.error('Delete expense error:',err);
    toast('Unable to delete expense');
  }
}

let salesReportMode='today';
let salesReportDate='';
function dateKeyLocal(d){
 const x=new Date(d);
 if(Number.isNaN(x.getTime())) return '';
 return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function orderLocalDate(o){
 try{
  if(o.createdAt && typeof o.createdAt.toDate==='function') return dateKeyLocal(o.createdAt.toDate());
  if(o.createdAt && typeof o.createdAt.seconds==='number') return dateKeyLocal(new Date(o.createdAt.seconds*1000));
  if(o.date){
   const raw=String(o.date).trim();
   let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
   if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
   m=raw.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
   if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  if(o.time && /^\d{4}-\d{2}-\d{2}/.test(String(o.time))) return String(o.time).slice(0,10);
 }catch(e){}
 return '';
}
function salesDateFilter(){
  const now=new Date();
  const today=dateKeyLocal(now);
  if(salesReportMode==='today') return {from:today,to:today,label:'Today'};
  if(salesReportMode==='yesterday') { const d=new Date(now); d.setDate(d.getDate()-1); const x=dateKeyLocal(d); return {from:x,to:x,label:'Yesterday'}; }
  if(salesReportMode==='week') { const d=new Date(now); const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return {from:dateKeyLocal(d),to:today,label:'This Week'}; }
  if(salesReportMode==='month') return {from:`${today.slice(0,7)}-01`,to:today,label:'This Month'};
  if(salesReportMode==='lastmonth') { const d=new Date(now.getFullYear(),now.getMonth()-1,1); const e=new Date(now.getFullYear(),now.getMonth(),0); return {from:dateKeyLocal(d),to:dateKeyLocal(e),label:'Last Month'}; }
  if(salesReportMode==='custom' && salesReportDate) return {from:salesReportDate,to:salesReportDate,label:new Date(salesReportDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
  return {from:today,to:today,label:'Select a date'};
}
function setSalesMode(v){salesReportMode=v; if(v!=='custom') salesReportDate=''; render();}
function setSalesDate(v){salesReportDate=String(v||''); render();}
function sales(){
 const range=salesDateFilter();
 const filtered=state.orders.filter(o=>isOrderPaid(o)&&(()=>{const d=orderLocalDate(o);return d&&d>=range.from&&d<=range.to;})());
 const revenue=filtered.reduce((a,o)=>a+Number(o.total||0),0);
 const orders=filtered.length;
 const aov=orders?revenue/orders:0;
 const highest=filtered.reduce((m,o)=>Math.max(m,Number(o.total||0)),0);
 const items={};
 filtered.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name||'Unknown'; if(!items[k]) items[k]={qty:0,revenue:0}; items[k].qty+=Number(i.qty||0); items[k].revenue+=Number(i.price||i.rate||0)*Number(i.qty||0);}));
 const rows=Object.entries(items).sort((a,b)=>b[1].revenue-a[1].revenue);
 return pageTitle('Sales Reports','Revenue, orders, AOV, item/category/combo and payment reports')+`
 <div class="card">
   <div class="filters" style="align-items:end;flex-wrap:wrap">
     <label style="min-width:150px"><span class="muted">Revenue Period</span><select id="salesMode" class="select" onchange="setSalesMode(this.value)">
       <option value="today" ${salesReportMode==='today'?'selected':''}>Today</option><option value="yesterday" ${salesReportMode==='yesterday'?'selected':''}>Yesterday</option><option value="week" ${salesReportMode==='week'?'selected':''}>This Week</option><option value="month" ${salesReportMode==='month'?'selected':''}>This Month</option><option value="lastmonth" ${salesReportMode==='lastmonth'?'selected':''}>Last Month</option><option value="custom" ${salesReportMode==='custom'?'selected':''}>Custom Date</option>
     </select></label>
     ${salesReportMode==='custom'?`<label style="min-width:180px"><span class="muted">Type / select date</span><input class="input" type="date" value="${salesReportDate}" onchange="setSalesDate(this.value)"></label>`:''}
     <button class="btn" onclick="render()">Refresh</button><button class="btn" onclick="exportCSV()">Export CSV</button>
   </div>
   <div class="section" style="padding:10px 0"><b>${range.label}</b><span class="muted"> — ${filtered.length} matching paid order${filtered.length===1?'':'s'}</span></div>
   <div class="grid three section">${[['Revenue',revenue],['Orders',orders],['AOV',aov],['Highest Order',highest],['Discounts',0],['Tax Collected',0]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><h2>${x[0]==='Orders'?x[1]:money(x[1])}</h2></div>`).join('')}</div>
   <div class="table-wrap section"><table class="data"><thead><tr><th>Item</th><th>Qty</th><th>Revenue</th><th>Share</th></tr></thead><tbody>${rows.length?rows.map(([name,x])=>`<tr><td>${name}</td><td>${x.qty}</td><td>${money(x.revenue)}</td><td>${revenue?Math.round(x.revenue/revenue*100):0}%</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No sales found for ${range.label}. Try another date.</td></tr>`}</tbody></table></div>
 </div>`;
}
function invreports(){
 const now=new Date(), month=now.getMonth(), year=now.getFullYear();
 const monthPurchases=state.purchases.filter(p=>{const raw=String(p.date||''); const m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); return m?Number(m[2])-1===month&&Number(m[3])===year:false;}).reduce((a,p)=>a+Number(p.total||0),0);
 const stockValue=state.inventory.reduce((a,x)=>a+Number(x.qty||0)*Number(x.cost||0),0);
 const low=state.inventory.filter(x=>Number(x.qty||0)<=Number(x.min||0)).length;
 return `<div class="top"><div><h1>Inventory Reports</h1><p>Live stock value and purchase summary from Firestore</p></div></div><div class="grid three">${[['Current Stock Value',stockValue],['Purchases This Month',monthPurchases],['Inventory Items',state.inventory.length],['Low Stock Items',low]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><h2>${x[0]==='Inventory Items'||x[0]==='Low Stock Items'?x[1]:money(x[1])}</h2><p class="muted">Live calculated value</p></div>`).join('')}</div><div class="card section"><h2>Stock Equation</h2><p class="muted">Current stock value = quantity × current cost for every inventory item.</p></div>`;
}
function pnl(){
 const paidOrders=state.orders.filter(isOrderPaid);
 const rev=paidOrders.reduce((a,o)=>a+Number(o.total||0),0);
 const cogs=paidOrders.reduce((a,o)=>a+(o.items||[]).reduce((s,i)=>{const m=state.menu.find(x=>x.id===i.id||x.name===i.name);const cost=Number(i.cost??m?.cost??0);return s+cost*Number(i.qty||0)},0),0);
 const otherOp=state.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const staffSalary=state.staff.reduce((a,x)=>a+Number(x.salary||0),0);
 const op=otherOp+staffSalary;
 return pageTitle('Profit & Loss','Revenue, COGS, staff salaries and other operating expenses')+`<div class="card"><div class="grid three"><div><span class="muted">Revenue</span><h2>${money(rev)}</h2></div><div><span class="muted">COGS / Product Cost</span><h2>${money(cogs)}</h2></div><div><span class="muted">Staff Salaries / Month</span><h2>${money(staffSalary)}</h2></div></div><div class="grid three section"><div><span class="muted">Other Operating Expenses</span><h2>${money(otherOp)}</h2></div><div><span class="muted">Total Operating Expenses</span><h2>${money(op)}</h2></div><div><span class="muted">Net Profit</span><h2 class="${rev-cogs-op>=0?'up':''}">${money(rev-cogs-op)}</h2></div></div><div class="section"><div class="card"><div class="section-title"><h2>Gross Profit</h2><b>${money(rev-cogs)}</b></div><div class="section-title"><h2>Net Profit</h2><b class="${rev-cogs-op>=0?'up':''}">${money(rev-cogs-op)}</b></div><p class="muted">Staff salaries are taken from the salary amounts saved in the Staff section and included in operating expenses. Other expenses come from the Expenses section.</p></div></div></div>`}
